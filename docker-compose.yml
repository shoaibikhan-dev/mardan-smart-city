
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mardan-postgres
    restart: always
    environment:
      POSTGRES_DB: desc_portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: StrongPass123!@#
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d desc_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mardan-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    container_name: mardan-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: desc_portal
      DB_USER: portal_user
      DB_PASSWORD: StrongPass123!@#
      JWT_SECRET: your-256-bit-secret-key-here-min-32-chars-long
      REFRESH_TOKEN_SECRET: another-256-bit-refresh-secret-key-here
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mardan-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
